name: Main

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build
      # docutils is the reference parser the tests compare against
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install docutils
      - run: npm test
